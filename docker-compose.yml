services:
  portfolio:
    image: ghcr.io/wangluoyigithub/portfolio-tracker:${PORTFOLIO_VERSION:-latest}
    container_name: portfolio-tracker
    restart: unless-stopped
    ports:
      - "${PORTFOLIO_BIND_IP:-127.0.0.1}:${PORTFOLIO_WEB_PORT:-18080}:8080"
    environment:
      PORTFOLIO_HOST: 0.0.0.0
      PORTFOLIO_PORT: 8080
      PORTFOLIO_DB: /app/data/portfolio.db
    volumes:
      - ./data:/app/data
    read_only: true
    tmpfs:
      - /tmp:size=16m
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL

  backup:
    image: ghcr.io/wangluoyigithub/portfolio-tracker:${PORTFOLIO_VERSION:-latest}
    profiles: ["tools"]
    environment:
      PORTFOLIO_DB: /app/data/portfolio.db
      PORTFOLIO_BACKUP_DIR: /app/data/backups
    volumes:
      - ./data:/app/data
    read_only: true
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    entrypoint: ["python", "/app/backup.py"]
